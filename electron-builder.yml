appId: com.antares.app
productName: Antares
copyright: Copyright © 2026 Antares
directories:
  output: dist-electron
  buildResources: assets
compression: maximum
files:
  - "!frontend/src/**/*"
  - "!frontend/public/**/*"
  - "!tests/**/*"
  - "!backend/**/*"
  - "!scripts/**/*"
  - "!docs/**/*"
  - "!data/**/*"
  - "!build/**/*"
  - "!dist/**/*"
  - "!**/.git/**/*"
  - "!**/.factory/**/*"
  - "!**/.github/**/*"
  - "!**/node_modules/.bin/**/*"
  - "!**/node_modules/.cache/**/*"
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/*.ts"
  - "!**/node_modules/**/*.d.ts"
  - "!**/node_modules/**/test/**/*"
  - "!**/node_modules/**/tests/**/*"
  - "!**/node_modules/**/docs/**/*"
  - "!**/node_modules/**/examples/**/*"
  - "!**/node_modules/**/README*"
  - "!**/node_modules/**/CHANGELOG*"
  - "!**/node_modules/**/LICENSE*"
  - "!node_modules/concurrently/**/*"
  - "!node_modules/wait-on/**/*"
  - "!node_modules/electron/**/*"
  - "!node_modules/electron-builder/**/*"
  - "!node_modules/electron-builder-squirrel-windows/**/*"
  - "!node_modules/app-builder-lib/**/*"
  - "!node_modules/builder-util/**/*"
  - "!node_modules/builder-util-runtime/**/*"
  - "!node_modules/dmg-builder/**/*"
  - "!node_modules/electron-publish/**/*"
  - "!node_modules/electron-rebuild/**/*"
  - "!node_modules/@electron/**/*"
  # Build-only native binaries and dev tooling hoisted to top-level node_modules.
  # These are transitives of electron-builder/typescript and must NOT ship in the installer.
  - "!node_modules/app-builder-bin/**/*"
  - "!node_modules/7zip-bin/**/*"
  - "!node_modules/typescript/**/*"
  - "!node_modules/node-gyp/**/*"
  - "!node_modules/@types/**/*"
  - "!node_modules/rxjs/**/*"
  - "!node_modules/lodash/**/*"
  - "!node_modules/axios/**/*"
  - "!node_modules/config-file-ts/**/*"
  - "!node_modules/path-scurry/**/*"
  - "!node_modules/async/**/*"
  - "frontend/dist/**/*"
  - "electron/**/*"
  - "shared/**/*"
  - "assets/icon.ico"
  - "node_modules/**/*"
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/*.ts"
  - "!**/node_modules/**/*.d.ts"
  - "!**/node_modules/**/test/**/*"
  - "!**/node_modules/**/tests/**/*"
  - "!**/node_modules/**/docs/**/*"
  - "!**/node_modules/**/examples/**/*"
  - "!**/node_modules/**/README*"
  - "!**/node_modules/**/CHANGELOG*"
extraResources:
  - from: formatos
    to: formatos
    filter: ["**/*"]
  - from: dist
    to: backend
    filter: ["AntaresBackend*"]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
  legalTrademarks: "Antares"
  requestedExecutionLevel: asInvoker
  # Disabled because installers are not code-signed. Required for
  # electron-updater to accept new versions on unsigned Windows builds.
  verifyUpdateCodeSignature: false
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Antares
  uninstallDisplayName: "Antares"
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  artifactName: "Antares-Setup-${version}.exe"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: true
  displayLanguageSelector: false
portable:
  artifactName: "Antares-Portable-${version}.exe"
publish:
  provider: github
  owner: sechgio
  repo: antares
  releaseType: release
asar: true
# Only unpack truly native modules (.node binaries) so they're loadable from disk.
# Everything else stays inside app.asar to keep the install footprint small.
asarUnpack:
  - "**/*.node"
  - "node_modules/**/build/Release/*.node"
electronLanguages:
  - es
  - en-US
