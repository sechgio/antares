# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project]
name = "hidro-convert-backend"
version = "0.11.10"
description = "Backend for Antares - Image conversion and renaming"
authors = [
    {name = "Antares", email = "dev@antares.app"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=12.3.0",
    "Jinja2>=3.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pypdf>=6.15.0",
    "pymupdf>=1.24.0",
    "weasyprint>=68.0",
    "python-docx>=1.1.0",
    "jsonschema>=4.0.0",
    "lxml>=6.1.2",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pip-audit>=2.7.0",
    "types-openpyxl>=3.1.0",
    "types-psutil>=5.9.0",
    "lxml-stubs>=0.5.0",
]
build = [
    "pyinstaller==6.21.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["E402"]
# B023: in _run_batch_conversion the closure _submit_one captures task_queue /
# in_flight / futures, which are reassigned inside the for-chunk loop and the
# closure is always invoked in the same iteration (never stored/deferred), so the
# late-binding capture is correct. ruff's B023 trips because they look like loop
# variables but are not the loop iterator (chunk_start).
"backend/handlers/conversion.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: long-running stress tests (e.g. 10k conversion queue)",
]
