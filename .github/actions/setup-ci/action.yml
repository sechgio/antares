name: Setup CI
description: Node from .node-version, Python 3.10, locked uv, npm ci (root + frontend)

inputs:
  python:
    description: Install the locked Python environment
    default: 'true'
  root:
    description: Install root Node dependencies
    default: 'true'
  frontend:
    description: Install frontend Node dependencies
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Python
      if: inputs.python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.node-version'
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json

    - name: Install uv
      if: inputs.python == 'true'
      shell: bash
      run: python -m pip install uv==0.11.19

    - name: Locate uv cache
      if: inputs.python == 'true'
      id: uv-cache
      shell: bash
      run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Python dependencies
      if: inputs.python == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.uv-cache.outputs.dir }}
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.github/actions/setup-ci/action.yml') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Sync Python dependencies
      if: inputs.python == 'true'
      shell: bash
      run: uv sync --locked --extra dev

    - name: Install Node dependencies
      if: inputs.root == 'true'
      shell: bash
      run: npm ci

    - name: Install frontend dependencies
      if: inputs.frontend == 'true'
      shell: bash
      run: npm ci --prefix frontend
