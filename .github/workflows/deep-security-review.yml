# factory-automation: a5fe5680-e1b3-47e0-a352-3c5f3c76a005
name: Deep Security Review
"on":
  workflow_dispatch: {}
  schedule:
    - cron: 0 6 * * 1
permissions:
  contents: read
concurrency:
  group: droid-security-audit
  cancel-in-progress: false
jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Factory Droid (versión fijada)
        env:
          DROID_VERSION: 1.8.0
          DROID_BINARY_SHA256: 95591cc8f0e93c4fd95155a096d4f3e79f7a34f3c75a8a01751779a618346335
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$RUNNER_TEMP/droid" \
            "https://downloads.factory.ai/factory-cli/releases/${DROID_VERSION}/linux/x64/droid"
          echo "${DROID_BINARY_SHA256}  ${RUNNER_TEMP}/droid" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/droid" "$HOME/.local/bin/droid"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run deep security review
        run: droid exec --mission --auto high -m glm-5.3-flash -r max "/security-review across the entire repository"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
      - name: Upload security review output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-security-review-${{ github.run_id }}
          path: ~/security-audits/
          if-no-files-found: warn
          retention-days: 7
