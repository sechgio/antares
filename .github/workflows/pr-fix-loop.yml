name: PR Diagnostics

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to diagnose"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  diagnose:
    name: Inspect failed PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate PR number
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number: $PR_NUMBER"
            exit 1
          fi

      - name: Diagnose failed checks without side effects
        shell: bash
        run: |
          node scripts/pr-fix-loop.js --pr "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
