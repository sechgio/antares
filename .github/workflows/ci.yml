name: CI

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  lint:
    name: Lint, format, and audits (Windows)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0

      - name: Setup lint toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          frontend: 'false'

      - name: Run oxlint and ruff
        run: bun run lint && bun run format:check

      - name: Run guards and dependency audits
        shell: bash
        run: >-
          bun run check:any && bun run check:ratchet &&
          bun run audit:python && bun run audit:node

  typecheck:
    name: Typecheck (Windows)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup typecheck toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          root: 'false'

      - name: Typecheck frontend (bun check)
        run: bun run typecheck:frontend

      - name: Typecheck backend (mypy)
        run: bun run typecheck:backend

  build:
    name: Frontend build and budgets (Windows)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup build toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          python: 'false'
          root: 'false'

      - name: Build frontend and check budgets
        run: bun run build:frontend

  contracts:
    name: Contracts and prompt budgets (Windows)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup contract toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          frontend: 'false'

      - name: Run contract suites and prompt budget
        shell: bash
        run: node scripts/run-test-suites.js contracts && node scripts/check-budgets.js --agent-prompt-only

  electron:
    name: Electron and runtime tests (Windows)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup Electron test toolchain
        uses: ./.github/actions/setup-ci
        with:
          frontend: 'false'

      - name: Run Electron and turns suites
        shell: bash
        run: node scripts/run-test-suites.js electron && node scripts/run-test-suites.js turns

  frontend:
    name: Frontend tests (Windows, shard 1/2)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup frontend toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          python: 'false'
          root: 'false'

      - name: Run frontend tests (shard 1 of 2)
        run: node scripts/run-test-suites.js frontend 1/2

  frontend-shard-2:
    name: Frontend tests (Windows, shard 2/2)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup frontend toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          python: 'false'
          root: 'false'

      - name: Run frontend tests (shard 2 of 2)
        run: node scripts/run-test-suites.js frontend 2/2

  backend:
    name: Backend tests (Windows)
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup backend toolchain
        uses: ./.github/actions/setup-ci
        with:
          node: 'false'
          root: 'false'
          frontend: 'false'

      - name: Identify runner image
        id: runner-image
        shell: pwsh
        run: |
          $os = if ($env:ImageOS) { $env:ImageOS } else { 'windows' }
          $ver = if ($env:ImageVersion) { $env:ImageVersion } else { 'custom' }
          "version=$os-$ver" >> $env:GITHUB_OUTPUT

      - name: Cache installed Pango runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/AppData/Local/antares-pango-dlls
          key: pango-dlls-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('scripts/install-ci-pango.ps1') }}

      - name: Install and validate Pango
        shell: pwsh
        run: ./scripts/install-ci-pango.ps1

      - name: Cache editor media toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            media/ffmpeg.exe
            media/ffprobe.exe
          key: editor-media-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('media/manifest.json') }}

      - name: Install and validate editor media
        shell: pwsh
        run: ./scripts/install-ci-editor-media.ps1

      - name: Run backend tests
        run: node scripts/run-test-suites.js backend

      - name: Run slow stress and scalability tests (excluded from the default gate)
        run: uv run --project . --locked --extra dev pytest tests/test_stress_conversion.py tests/test_scalability_baseline.py -m slow -q

  verify:
    name: Lint, audit, and test (Windows)
    needs: [lint, typecheck, build, contracts, electron, frontend, frontend-shard-2, backend]
    if: always()
    runs-on: ${{ vars.CI_USE_BLACKSMITH == 'true' && 'blacksmith-2vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        shell: pwsh
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          ELECTRON_RESULT: ${{ needs.electron.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_SHARD_2_RESULT: ${{ needs.frontend-shard-2.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          foreach ($result in @(
            $env:LINT_RESULT,
            $env:TYPECHECK_RESULT,
            $env:BUILD_RESULT,
            $env:CONTRACTS_RESULT,
            $env:ELECTRON_RESULT,
            $env:FRONTEND_RESULT,
            $env:FRONTEND_SHARD_2_RESULT,
            $env:BACKEND_RESULT
          )) {
            if ($result -ne 'success') { throw "Required CI job ended with: $result" }
          }
