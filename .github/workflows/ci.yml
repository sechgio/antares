name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, audit, and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Cache MSYS2 packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pango-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            msys2-pango-${{ runner.os }}-

      - name: Run checks and test suites in parallel
        shell: bash
        env:
          WEASYPRINT_DLL_DIRECTORIES: C:\msys64\mingw64\bin
        run: >-
          npx --no-install concurrently --kill-others-on-fail --success all
          --names quality-backend,frontend --timings
          "pwsh -NoProfile -File scripts/install-ci-pango.ps1 &&
          npm run lint:python && npm run typecheck:backend &&
          npm run check:any && npm run check:ratchet &&
          npm run audit:python && npm run audit:node &&
          npm run build:frontend &&
          node scripts/run-test-suites.js contracts && node scripts/run-test-suites.js backend && node scripts/run-test-suites.js electron"
          "node scripts/run-test-suites.js frontend"

      - name: Run slow stress tests (excluded from the default gate)
        run: uv run --project . --locked --extra dev pytest tests/test_stress_conversion.py -m slow -q
