name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver release tag to build (for example v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, audit, and test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

      - name: Run CI checks
        run: npm run ci

      # Keep this report visible without blocking existing releases until the
      # currently reported dependency advisories are remediated.
      - name: Report Node dependency audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          root_status=$?
          (cd frontend && npm audit --omit=dev --audit-level=high)
          frontend_status=$?
          if [[ $root_status -ne 0 || $frontend_status -ne 0 ]]; then
            echo "Node dependency audit reported vulnerabilities; see the output above."
          fi

  build:
    name: Build release artifacts
    permissions:
      contents: read
    needs: [verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Native Pango/GTK DLLs so WeasyPrint can load during packaging and so
      # PyInstaller / runtime resolution can see WEASYPRINT_DLL_DIRECTORIES.
      - name: Install Pango/GTK via MSYS2 (for WeasyPrint)
        run: |
          C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-x86_64-pango --noconfirm'
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          if (Test-Path "C:\msys64\mingw64\bin\python.exe") {
            Remove-Item "C:\msys64\mingw64\bin\python.exe" -Force
          }
          echo "WEASYPRINT_DLL_DIRECTORIES=C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Electron and electron-builder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          npm ci
          cd frontend
          npm ci
          cd ..
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Build Backend
        run: npm run build:backend

      - name: Build Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:frontend

      - name: Build Electron App
        run: npx --no-install electron-builder --win --publish never

      - name: Generate release checksums
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath 'dist-electron' -File
          if (-not $files) {
            throw 'No Electron artifacts were produced.'
          }
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $checksums | Set-Content -LiteralPath 'dist-electron/SHA256SUMS.txt' -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: dist-electron
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: dist-electron

      - name: Create release if needed and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist-electron/* \
            --repo "$REPOSITORY" \
            --clobber
