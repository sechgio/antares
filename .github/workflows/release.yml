name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver release tag to build (for example v1.2.3)'
        required: true
        type: string
      publish:
        description: 'Publish the validated artifacts to GitHub Releases'
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, audit, and test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

      - name: Run CI checks
        run: npm run ci

  build:
    name: Build release artifacts
    permissions:
      contents: read
    needs: [verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache MSYS2 packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pango-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            msys2-pango-${{ runner.os }}-

      # Native Pango/GTK DLLs so WeasyPrint can load during packaging and so
      # PyInstaller / runtime resolution can see WEASYPRINT_DLL_DIRECTORIES.
      - name: Install Pango/GTK via MSYS2 (for WeasyPrint)
        run: |
          C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-x86_64-pango --noconfirm --needed'
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          if (Test-Path "C:\msys64\mingw64\bin\python.exe") {
            Remove-Item "C:\msys64\mingw64\bin\python.exe" -Force
          }
          echo "WEASYPRINT_DLL_DIRECTORIES=C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Electron and electron-builder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          python -m pip install -e ".[build]"

      - name: Validate required build configuration
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          $required = @('VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Required build configuration is missing: $name"
            }
          }

      - name: Build Backend and Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx concurrently "npm run build:backend" "npm run build:frontend"

      - name: Build Electron App
        run: npx --no-install electron-builder --win --publish never

      - name: Generate release checksums
        shell: pwsh
        run: |
          $requiredPatterns = @(
            'Antares-Setup-*.exe',
            'Antares-Setup-*.exe.blockmap',
            'Antares-Portable-*.exe',
            'latest.yml'
          )
          $files = foreach ($pattern in $requiredPatterns) {
            $matches = @(Get-ChildItem -Path "dist-electron/$pattern" -File)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one release asset matching $pattern, found $($matches.Count)."
            }
            $matches[0]
          }
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $checksums | Set-Content -LiteralPath 'dist-electron/SHA256SUMS.txt' -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: |
            dist-electron/Antares-Setup-*.exe
            dist-electron/Antares-Setup-*.exe.blockmap
            dist-electron/Antares-Portable-*.exe
            dist-electron/latest.yml
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: dist-electron

      - name: Publish validated assets atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace published assets."
            exit 1
          fi

          published=false
          cleanup_draft() {
            if [[ "$published" != "true" ]]; then
              gh release delete "$RELEASE_TAG" --repo "$REPOSITORY" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft EXIT

          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft

          assets=(
            dist-electron/Antares-Setup-*.exe
            dist-electron/Antares-Setup-*.exe.blockmap
            dist-electron/Antares-Portable-*.exe
            dist-electron/latest.yml
            dist-electron/SHA256SUMS.txt
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset: $asset"
              exit 1
            fi
          done

          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$REPOSITORY"

          uploaded_count="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$uploaded_count" -ne 5 ]]; then
            echo "Expected 5 uploaded assets, found $uploaded_count"
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
          published=true
